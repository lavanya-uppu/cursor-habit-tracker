<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["DM Sans", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              ink: "#1c1917",
              moss: "#3f6b4a",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-stone-100 text-ink font-sans antialiased">
    <div class="mx-auto flex min-h-screen max-w-lg flex-col px-5 py-10 sm:py-16">
      <header class="mb-8">
        <p id="today-label" class="text-sm font-medium uppercase tracking-[0.18em] text-stone-500"></p>
        <h1 class="mt-2 text-3xl font-semibold tracking-tight">Habits</h1>
        <p class="mt-2 text-stone-500">Small daily actions, kept in one quiet list.</p>
      </header>

      <section
        class="mb-6 rounded-2xl border border-stone-200 bg-white p-5 shadow-sm shadow-stone-200/60"
        aria-label="Today's progress"
      >
        <div class="flex items-end justify-between gap-4">
          <div>
            <p class="text-sm text-stone-500">Today</p>
            <p id="progress-text" class="mt-1 text-lg font-medium">0 of 0 done</p>
          </div>
          <p id="progress-percent" class="text-2xl font-semibold text-moss">0%</p>
        </div>
        <div class="mt-4 h-1.5 overflow-hidden rounded-full bg-stone-100">
          <div id="progress-bar" class="h-full w-0 rounded-full bg-moss transition-all duration-300"></div>
        </div>
      </section>

      <form id="habit-form" class="mb-8 flex gap-2">
        <label class="sr-only" for="habit-input">New habit</label>
        <input
          id="habit-input"
          name="habit"
          type="text"
          maxlength="80"
          autocomplete="off"
          placeholder="Add a habit…"
          class="w-full rounded-xl border border-stone-200 bg-white px-4 py-3 text-base outline-none transition placeholder:text-stone-400 focus:border-moss focus:ring-2 focus:ring-moss/20"
        />
        <button
          type="submit"
          class="shrink-0 rounded-xl bg-ink px-4 py-3 text-sm font-medium text-white transition hover:bg-stone-800 focus:outline-none focus:ring-2 focus:ring-ink/30"
        >
          Add
        </button>
      </form>

      <ul id="habit-list" class="flex flex-col gap-2" aria-live="polite"></ul>

      <p id="empty-state" class="hidden rounded-2xl border border-dashed border-stone-300 px-5 py-10 text-center text-stone-500">
        No habits yet. Add one above to begin tracking today.
      </p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
